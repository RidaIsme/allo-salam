<!DOCTYPE html>
<html>
<head>
    <title>Gaming Universe</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #020617;
            color: white;
        }

        /* NAVBAR */
        .nav {
            display: flex;
            justify-content: space-between;
            padding: 20px 40px;
            background: rgba(0,0,0,0.8);
        }

        .logo {
            color: #00ffcc;
            font-size: 24px;
            font-weight: bold;
        }

        .menu a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
            transition: 0.3s;
        }

        .menu a:hover {
            color: #00ffcc;
        }

        /* HERO */
        .hero {
            text-align: center;
            padding: 100px 20px;
            background: url("https://images.unsplash.com/photo-1542751371-adc38448a05e") no-repeat center/cover;
        }

        .hero h1 {
            font-size: 60px;
            text-shadow: 0 0 20px #00ffcc;
        }

        .hero button {
            padding: 15px 40px;
            margin-top: 20px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg,#00ffcc,#00ccff);
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .hero button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #00ffcc;
        }

        /* CARDS */
        .games {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 50px;
            flex-wrap: wrap;
        }

        .card {
            background: #0f172a;
            width: 250px;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .card img {
            width: 100%;
        }

        .card h3 {
            padding: 10px;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 20px #00ffcc;
        }

    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="nav">
        <div class="logo">🎮 GamingX</div>
        <div class="menu">
            <a href="#">Accueil</a>
            <a href="#">Jeux</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <!-- HERO -->
    <div class="hero">
        <h1>WELCOME GAMER</h1>
        <p>Entre dans un univers de jeux incroyables</p>
        <button>PLAY NOW</button>
    </div>

    <!-- GAMES -->
    <div class="games">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1606813907291-d86efa9b94db">
            <h3>FPS Shooter</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420">
            <h3>Battle Royale</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1493711662062-fa541adb3fc8">
            <h3>RPG Adventure</h3>
        </div>

    </div>

</body>
</html>
