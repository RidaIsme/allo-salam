<!DOCTYPE html>
<html>
<head>
<title>Mon Snap</title>

<!-- POLICE -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #0f172a, #020617);
    font-family: 'Orbitron', sans-serif;
}

/* BOUTON SNAP */
.snap-btn {
    padding:20px 50px;
    font-size:22px;
    color:black;
    background:#FFFC00;
    border:none;
    border-radius:50px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 0 20px #FFFC00;
    transition:0.3s;
    letter-spacing:2px;
}

/* HOVER */
.snap-btn:hover {
    transform:scale(1.1);
    box-shadow:0 0 40px #FFFC00;
}

/* ANIMATION */
.snap-btn {
    animation:pulse 1.5s infinite;
}

@keyframes pulse {
    0% { box-shadow:0 0 10px #FFFC00; }
    50% { box-shadow:0 0 40px #FFFC00; }
    100% { box-shadow:0 0 10px #FFFC00; }
}
</style>
</head>

<body>

<!-- 🎵 MUSIQUE -->
<audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<a href="https://snapchat.com/add/rida31100" target="_blank">
    <button class="snap-btn">👻 AJOUTE MOI SUR SNAP</button>
</a>

</body>
</html>
