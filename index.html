<!DOCTYPE html>
<html>
<head>
<title>Snap Style</title>

<!-- POLICE MODERNE -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Poppins', sans-serif;
    background: linear-gradient(135deg, #FFFC00, #ffe600);
    overflow:hidden;
}

/* BULLES */
.bubble {
    position:absolute;
    border-radius:50%;
    background: rgba(255,255,255,0.2);
}

/* BOUTON */
.snap-btn {
    padding:25px 60px;
    font-size:24px;
    color:black;
    background:white;
    border:none;
    border-radius:50px;
    cursor:pointer;
    font-weight:800;
    box-shadow:0 0 30px white;
    transition:0.3s;
    border:3px solid black;
}

.snap-btn:hover {
    transform:scale(1.1);
    box-shadow:0 0 50px white;
}
</style>
</head>

<body>

<div class="bubble" style="width:120px;height:120px;left:15%;bottom:-120px;"></div>
<div class="bubble" style="width:180px;height:180px;left:65%;bottom:-180px;"></div>
<div class="bubble" style="width:90px;height:90px;left:45%;bottom:-90px;"></div>

<a href="https://snapchat.com/add/tonpseudo" target="_blank">
    <button class="snap-btn">👻 AJOUTE MOI SUR SNAP</button>
</a>

</body>
</html>
